name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two runners, because the flake we cannot fix is per-runner.
  #
  # `wrangler dev` dies under the D1 gate on cloudflare/workers-sdk#15317, and
  # thirty probe runs showed the deaths are not independent: a runner that kills
  # one session usually kills the next. run-d1-integration.sh re-runs the suite
  # in place, which clears the runners that recover, and twenty more runs put
  # what is left at 5% — a hard core of runners that die on every attempt.
  #
  # Nothing inside the job reaches that. A second runner is a fresh draw, so the
  # residual goes to roughly one run in four hundred. This first attempt is
  # therefore tolerated and reports nothing but its outcome; `verify` below is
  # the verdict, and a real failure fails both.
  verify-first-runner:
    name: verify (first runner, tolerated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.suite.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run the verification suite
        id: suite
        continue-on-error: true
        uses: ./.github/actions/run-verify

  verify:
    name: verify
    needs: verify-first-runner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Accept the first runner's pass
        if: needs.verify-first-runner.outputs.outcome == 'success'
        run: echo "The suite passed on the first runner; nothing to re-run."

      # Anything other than a pass lands here, an empty outcome included: a
      # first attempt that was cancelled or never reported must not be read as
      # a pass.
      - name: Check out repository
        if: needs.verify-first-runner.outputs.outcome != 'success'
        uses: actions/checkout@v6

      - name: Run the verification suite on a fresh runner
        if: needs.verify-first-runner.outputs.outcome != 'success'
        uses: ./.github/actions/run-verify

  # A store is created by cloning a tag of this repository (plan §3.4), so the
  # baseline that matters is what a FRESH CLONE builds — not what an incrementally
  # updated checkout builds. `verify` above runs in a tree that already carries a
  # rendered wrangler.jsonc and generated theme artifacts; this job proves the
  # commit stands on its own, from the committed files and the lockfiles alone.
  clean-clone:
    name: Build from a clean clone
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The script re-clones HEAD from this checkout's object store, and
          # git refuses several local-clone modes against a shallow repository.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install, build and dry-run deploy from a scratch clone
        run: npm run check:clean-clone

  # Which themes exist is a property of the TREE, not of this file: a generated
  # store carries its merchant-owned theme plus whatever shipped themes it kept,
  # and a hardcoded list here would silently stop covering them. Discovery
  # asks the same resolver the build uses.
  discover:
    name: Discover themes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      themes: ${{ steps.discover.outputs.themes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List themes not covered by the main job
        id: discover
        run: |
          themes=$(node --input-type=module -e "
            import { discoverThemeIds, resolveConfiguredTheme } from './scripts/themes.mjs';
            const configured = resolveConfiguredTheme().id;
            console.log(JSON.stringify(discoverThemeIds().filter((id) => id !== configured)));
          ")
          echo "discovered: $themes"
          echo "themes=$themes" >> "$GITHUB_OUTPUT"

  # The main job verifies whichever theme theme.config.json names. The
  # contract suite exists precisely to hold for ANY design — so run it against
  # every other theme in the tree. Not the full `verify`: the parts this omits
  # (integration, MCP, scaffold, Stripe country data) are set-independent and
  # would only multiply the bill.
  themes:
    name: Verify theme (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: discover
    if: needs.discover.outputs.themes != '[]'

    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.discover.outputs.themes) }}

    env:
      THEME: ${{ matrix.theme }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install storefront dependencies
        run: npm ci

      - name: Create isolated Wrangler configuration
        run: |
          sed \
            -e 's/__NAME__/minshop-check/g' \
            -e 's/__DB_NAME__/minshop-check-db/g' \
            -e 's/__DB_ID__/00000000-0000-0000-0000-000000000000/g' \
            -e 's/__BUCKET__/minshop-check-images/g' \
            -e 's/__FILES_BUCKET__/minshop-check-files/g' \
            wrangler.template.jsonc > wrangler.jsonc

      - name: Verify the theme builds and honours the contract
        run: npm run verify:theme
